services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres # fix: password was missing, postgres could not start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  cache:
    image: redis:7-alpine

  web:
    image: nginx:alpine
    ports:
      - "8080:80"

  api:
    image: nginx:alpine
    ports:
      - "8081:8080" # fix: 8080 was already used by web, port conflict
    depends_on:
      - db # fix: was "databse" (typo), that service did not exist
