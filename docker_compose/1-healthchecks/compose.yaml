services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://todo:todo@database:5432/todo
    ports:
      - "3001:3000"
