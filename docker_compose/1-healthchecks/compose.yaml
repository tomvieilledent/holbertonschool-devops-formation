services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://admin:admin@database:5432/admin
    ports:
      - "3001:3000"
